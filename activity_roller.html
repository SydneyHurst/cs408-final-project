        <div class="content">
        <div class="col">
  <h1>Item Roller</h1>

  <div class="box">
    <label><input type="checkbox" id="sick"> Character is sick (-10%)</label>
    <button onclick="rollItems()">Roll Items</button>

    <div id="results" class="results"></div>
  </div>
</div>
  <script>
    function getRarity(value) {
      if (value <= 50) return "Common";
      if (value <= 80) return "Uncommon";
      return "Rare";
    }

    function rollItems() {
      const isSick = document.getElementById("sick").checked;
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      const itemCount = Math.floor(Math.random() * 3) + 1; // 1–3 items

      for (let i = 1; i <= itemCount; i++) {
        let roll = Math.floor(Math.random() * 100) + 1;
        let adjusted = isSick ? Math.max(1, roll - 10) : roll;
        const rarity = getRarity(adjusted);

        const itemEl = document.createElement("div");
        itemEl.className = "item";
        itemEl.innerText = `Item ${i}: Rolled ${roll}${isSick ? ` (adjusted to ${adjusted})` : ""} → ${rarity}`;
        resultsDiv.appendChild(itemEl);
      }
    }
  </script>
</body>
