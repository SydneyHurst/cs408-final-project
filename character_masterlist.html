<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Character Masterlist</title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <link href='https://fonts.googleapis.com/css?family=Electrolize' rel='stylesheet'>
</head>

<body>
  <div class="header">
    <div class="logo">
      <img src="/img/Cat_Silhouette_PNG_Transparent_Clip_Art_Image.png" width="99">
    </div>
    <h1>Purrfect Rollers and Guides</h1>
  </div>
  
  <ul>
    <li><a href="index.html">Home</a></li>
    
    <li class="dropdown">
      <a class="dropbtn">Characters</a>
      <div class="dropdown-content">
        <a href="create_edit_character.html">Create/Edit Character</a>
        <a href="character_masterlist.html">Character Masterlist</a>
        <a href="character_guide.html">Character Guide</a>
      </div>
    </li>
    <li><a href="exp_calculator.html">EXP Calculator</a></li>
    <li><a href="exp_guide.html">EXP Guide</a></li>
    <li><a href="activity_roller.html">Activity Roller</a></li>
    <li><a href="activity_guide.html">Activity Guide</a></li>
  </ul>
  
  <div class="content">
  <h1>Character List</h1>
  <div id="character-container">Loading...</div>
</div>

  <script>
    fetch('https://nbsaqqdmvj.execute-api.us-east-2.amazonaws.com/characters')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('character-container');
        container.innerHTML = ''; // Clear "Loading..."

        if (!Array.isArray(data) || data.length === 0) {
          container.textContent = 'No characters found.';
          return;
        }

        data.sort((a, b) => Number(a.id) - Number(b.id));

        data.forEach(char => {
        const card = document.createElement('div');
        card.className = 'character-card';

        card.innerHTML = `
        <h3>${char.id} - ${char.name}</h3>
        <p><b>Status</b>: ${char.health}</p>
        <p><b>EXP</b>: ${char.exp}</p>
        <p><b>Rank</b>: ${char.rank}</p>
      `;

      container.appendChild(card);
        });
      })
      .catch(err => {
        console.error('Error:', err);
        document.getElementById('character-container').textContent = 'Failed to load characters.';
      });
  </script>
</body>

</html>
